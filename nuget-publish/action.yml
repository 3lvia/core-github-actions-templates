name: 'NuGet Publish'
description: 'Publish NuGet packages to nuget.org through the central nuget-publisher (Trusted Publishing, no API key). One publish may carry several packages.'
inputs:
  system:
    description: 'System name, used to log in to Vault (same as for the vault action).'
    required: true
  packages-path:
    description: 'Directory containing the packed .nupkg files (and optional .snupkg). All of them are delivered.'
    required: false
    default: './artifacts'
  wait:
    description: 'Wait for the publisher run and fail this job if it fails.'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Check inputs
      shell: bash
      run: |
        # Explicit checks for required inputs, due to https://github.com/actions/runner/issues/1070
        [[ "$SYSTEM" ]] || { echo "Parameter 'system' is required, but is empty." ; exit 1; }
        shopt -s nullglob
        nupkgs=("$PACKAGES_PATH"/*.nupkg)
        [[ ${#nupkgs[@]} -gt 0 ]] || { echo "::error::No .nupkg found in '$PACKAGES_PATH'. Run 'dotnet pack' first, or set the 'packages-path' input." ; exit 1; }
      env:
        SYSTEM: ${{ inputs.system }}
        PACKAGES_PATH: ${{ inputs.packages-path }}

    - name: Upload packages as workflow artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: nupkg
        path: ${{ inputs.packages-path }}/*nupkg
        retention-days: 3
        if-no-files-found: error

    - name: Get publisher App credentials from Vault
      uses: 3lvia/core-github-actions-templates/vault@trunk
      with:
        system: ${{ inputs.system }}
        environment: dev
        exportToken: 'false'
        secrets: |
          libraries/kv/data/nuget-publisher nuget_publisher_app_id | NUGET_PUBLISHER_APP_ID ;
          libraries/kv/data/nuget-publisher nuget_publisher_app_key | NUGET_PUBLISHER_APP_KEY

    - name: Mint short-lived App token for nuget-publisher
      id: app
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ env.NUGET_PUBLISHER_APP_ID }}
        private-key: ${{ env.NUGET_PUBLISHER_APP_KEY }}
        owner: 3lvia
        repositories: nuget-publisher
        permission-actions: write
        permission-contents: read # packages.yaml, for the pre-check below

    - name: Check packages.yaml before dispatching
      shell: bash
      run: |
        # Fail fast on the most common mistake - a package that is not (yet) listed under this
        # repository in packages.yaml - before a publisher run is started and Core is alerted.
        # This mirrors scripts/authorise-packages.sh in nuget-publisher, which stays the
        # authoritative, fail-closed check. This pre-check is fail-OPEN: if packages.yaml cannot
        # be read or a tool is missing, we warn and let the publisher decide.
        edit="https://github.com/3lvia/nuget-publisher/edit/trunk/packages.yaml"
        if ! command -v yq >/dev/null || ! command -v unzip >/dev/null; then
          echo "::warning::yq/unzip not available on this runner; skipping the packages.yaml pre-check."
          exit 0
        fi
        if ! gh api -H "Accept: application/vnd.github.raw" \
              repos/3lvia/nuget-publisher/contents/packages.yaml > packages.yaml 2>/dev/null; then
          echo "::warning::Could not read packages.yaml from nuget-publisher; skipping the pre-check."
          exit 0
        fi
        if ! REPO="$GITHUB_REPOSITORY" yq -e '.[] | select(.repo == strenv(REPO))' packages.yaml >/dev/null 2>&1; then
          echo "::error::$GITHUB_REPOSITORY is not onboarded in nuget-publisher. Add it to packages.yaml (Core reviews the PR):"
          echo "::error::  edit -> $edit"
          echo "::error::  add   -> - repo: $GITHUB_REPOSITORY"
          echo "::error::           packages: [<Your.Package.Id>]"
          exit 1
        fi
        allowed=$(REPO="$GITHUB_REPOSITORY" yq -r '.[] | select(.repo == strenv(REPO)) | .packages[]' packages.yaml)
        shopt -s nullglob
        missing=0
        for f in "$PACKAGES_PATH"/*.nupkg; do
          id=$(unzip -p "$f" '*.nuspec' | grep -oE '<id>[^<]+' | head -1 | sed 's/<id>//')
          [[ "$id" ]] || { echo "::warning::Could not read the package id from $(basename "$f"); leaving it to the publisher."; continue; }
          if printf '%s\n' "$allowed" | grep -qxF -- "$id"; then
            echo "listed in packages.yaml: $id"
          else
            echo "::error::$GITHUB_REPOSITORY is not allowed to publish '$id'. Add it to $GITHUB_REPOSITORY's packages in packages.yaml:"
            echo "::error::  edit -> $edit"
            missing=1
          fi
        done
        [[ $missing -eq 0 ]] || exit 1
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        PACKAGES_PATH: ${{ inputs.packages-path }}

    - name: Dispatch nuget-publisher
      shell: bash
      run: |
        # Dispatch the central publisher; it downloads the artifact from this run,
        # authorises every package against packages.yaml, and publishes them.
        gh workflow run publish.yaml -R 3lvia/nuget-publisher --ref trunk \
          -f source_repo="$GITHUB_REPOSITORY" \
          -f run_id="$GITHUB_RUN_ID"
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}

    - name: Wait for the publisher
      id: wait
      if: ${{ inputs.wait == 'true' }}
      shell: bash
      run: |
        # Find the dispatched publisher run by the "<repo>#<run_id>" its run-name
        # embeds (unique). GitHub-hosted runs can queue, so poll generously — up
        # to ~5 min — and scan a wide window in case many deliveries are in flight.
        match="$GITHUB_REPOSITORY#$GITHUB_RUN_ID"
        id=""
        for attempt in $(seq 1 20); do
          sleep 15
          id=$(gh run list -R 3lvia/nuget-publisher -w publish.yaml --limit 100 \
                 --json databaseId,displayTitle \
                 --jq "[.[] | select(.displayTitle | contains(\"$match\")) | .databaseId] | first // empty")
          [[ "$id" ]] && break
          echo "waiting for the publisher run to appear (attempt $attempt)..."
        done
        [[ "$id" ]] || { echo "::error::Could not find the dispatched publisher run after 5 minutes. Check https://github.com/3lvia/nuget-publisher/actions." ; exit 1; }
        url="https://github.com/3lvia/nuget-publisher/actions/runs/$id"
        echo "Publisher run: $url"

        # Poll instead of `gh run watch`: watch also fetches check annotations, which this
        # token cannot read, and floods the log with "403 Forbidden" warnings.
        status=""
        for attempt in $(seq 1 80); do   # up to 20 min; the publisher itself takes ~30 s, the rest is queue
          status=$(gh run view "$id" -R 3lvia/nuget-publisher --json status --jq .status)
          [[ "$status" == "completed" ]] && break
          sleep 15
        done
        [[ "$status" == "completed" ]] || { echo "::error::The publisher run did not complete within 20 minutes: $url" ; exit 1; }
        conclusion=$(gh run view "$id" -R 3lvia/nuget-publisher --json conclusion --jq .conclusion)
        if [[ "$conclusion" == "success" ]]; then
          echo "Published. Details: $url"
          exit 0
        fi

        # Surface the publisher's own error messages here, so the team sees *why* without
        # leaving this run (e.g. which package is not mapped in packages.yaml).
        gh run view "$id" -R 3lvia/nuget-publisher --log-failed 2>/dev/null \
          | sed -E 's/\x1b\[[0-9;]*m//g' \
          | grep -oE '##\[error\].*' | sed -E 's/^##\[error\]//' \
          | grep -vE '^Process completed' | awk '!seen[$0]++' \
          | while IFS= read -r line; do echo "::error::$line"; done
        echo "::error::Publishing failed (publisher conclusion: $conclusion). Ensure every package this repository publishes is listed under it in https://github.com/3lvia/nuget-publisher/blob/trunk/packages.yaml, then re-run. Publisher run: $url"
        exit 1
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}

    - name: Show message on failure
      # Reached only if a step *before* the wait fails (Vault, token, dispatch); the wait
      # step prints the publisher's own errors itself.
      if: failure() && steps.wait.outcome != 'failure'
      shell: bash
      run: |
        echo "::error::Delivery to nuget-publisher failed before publishing started. Check the steps above; the publisher was not reached (or not found). Runs: https://github.com/3lvia/nuget-publisher/actions"
        exit 1
