name: Playwright Test
description: 'Run Playwright tests written in .NET.'
inputs:
  test-project:
    description: 'Name of test project file to run.'
    required: true
  environment:
    description: 'Environment is used to find correct Vault instance.'
    required: true
  system:
    description: 'System is used to log in to Vault using correct role.'
    required: true
  checkout:
    description: 'If `true`, the action will check out the repository. If `false`, the action will assume the repository has already been checked out.'
    required: false
    default: 'true'
  configuration:
    description: 'Value to set for the `--configuration` flag when running `dotnet test`.'
    required: false
    default: 'Debug'

  test-results-artifact-name:
    description:
      'Name of the workflow artifact that the raw .trx test result files are uploaded to. Must be unique within the
      workflow run.'
    required: false
    default: 'smoketest-results-${{ github.job }}-${{ github.action }}'
  test-results-retention-days:
    description: 'How many days to keep the uploaded test result artifact.'
    required: false
    default: '14'
runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      if: ${{ inputs.checkout == 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Login Vault and export token
      uses: 3lvia/core-github-actions-templates/vault@trunk
      with:
        system: ${{ inputs.system }}
        environment: ${{ inputs.environment }}
        exportToken: 'true'

    - name: Build .NET project
      shell: bash
      run: dotnet build '${{ inputs.test-project }}'

    - name: Install playwright
      shell: pwsh
      run: |
        $dirName = [System.IO.Path]::GetDirectoryName("${{ inputs.test-project }}")
        $playwrightscript = Get-ChildItem -Path $dirName -Filter playwright.ps1 -Recurse -ErrorAction SilentlyContinue -Force
        &$playwrightscript.FullName install

    - name: Run .NET tests
      shell: bash
      run: dotnet test -l:trx --configuration "$CONFIGURATION" "$TEST_PROJECT"
      env:
        CONFIGURATION: ${{ inputs.configuration }}
        TEST_PROJECT: ${{ inputs.test-project }}

    # The published check summary only carries outcomes; the raw .trx also has per-test timings,
    # start/end times and full failure details — and passed/skipped tests leave no other trace.
    # Without this upload the files die with the runner.
    - name: Upload test results
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.test-results-artifact-name }}
        path: |
          **/TestResults/*.trx
          .github/**/TestResults/*.trx
        retention-days: ${{ inputs.test-results-retention-days }}
        if-no-files-found: ignore

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
      if: always()
      with:
        files: |
          **/TestResults/*.trx
          .github/**/TestResults/*.trx
        check_name: 'Smoketest Results'
