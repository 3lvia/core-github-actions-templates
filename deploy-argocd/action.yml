name: 'Deploy Argo CD'
description: 'Deploys an application to Kubernetes using Argo CD.'
inputs:
  name:
    description: 'Name of application. Do not include namespace.'
    required: true
  system:
    description: 'System (namespace) of the application.'
    required: true
  cluster-type:
    description: 'Type of cluster to check deployment status for. Can be `aks`, `gke` or `iss`.'
    required: true
    default: 'aks'
  environment:
    description: 'Environment to deploy to.'
    required: true
  registry:
    description: 'Docker registry to use.'
    required: false
    default: 'containerregistryelvia.azurecr.io'
  ACR_USERNAME:
    description: 'Username for Azure Container Registry, if using it.'
    required: true
  ACR_PASSWORD:
    description: 'Password for Azure Container Registry, if using it.'
    required: true
  checkout:
    description: 'If `true`, the action will check out the repository. If `false`, the action will assume the repository has already been checked out.'
    required: false
    default: 'true'
  slack-channel:
    description: 'Slack channel to notify on failure. Leave empty to disable notifications.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Validate required inputs
      shell: bash
      run: |
        if [[ -z "$NAME" ]]; then
          echo "Error: input 'name' is required."
          exit 1
        fi

        if [[ -z "$SYSTEM" ]]; then
          echo "Error: input 'system' is required."
          exit 1
        fi

        if [[ -z "$ENVIRONMENT" ]]; then
          echo "Error: input 'environment' is required."
          exit 1
        fi

        if [[ -z "$ACR_USERNAME" ]]; then
          echo "Error: input 'ACR_USERNAME' is required."
          exit 1
        fi

        if [[ -z "$ACR_PASSWORD" ]]; then
          echo "Error: input 'ACR_PASSWORD' is required."
          exit 1
        fi
      env:
        NAME: ${{ inputs.name }}
        SYSTEM: ${{ inputs.system }}
        ENVIRONMENT: ${{ inputs.environment }}
        ACR_USERNAME: ${{ inputs.ACR_USERNAME }}
        ACR_PASSWORD: ${{ inputs.ACR_PASSWORD }}

    #   - name: Login to GitHub Container Registry
    #     if: contains(inputs.registry, 'ghcr.io')
    #     uses: docker/login-action@v3
    #     with:
    #       registry: 'ghcr.io'
    #       username: ${{ github.actor }}
    #       password: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to Azure Container Registry
      if: contains(inputs.registry, 'azurecr.io')
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.ACR_USERNAME }}
        password: ${{ inputs.ACR_PASSWORD }}

    - name: Install OIDC Client from Core Package
      shell: bash
      run: npm install @actions/core@1.11.1 @actions/http-client

    - name: Get OIDC Token
      uses: actions/github-script@v7
      id: get-token
      with:
        script: |
          const core_ = require('@actions/core')
          let idToken = await core_.getIDToken()
          core_.setOutput('token', idToken)

    - name: Check if image digest has changed
      shell: bash
      id: check-image-digest
      run: |
        old_image_digest=$(skopeo inspect docker://$OLD_IMAGE | jq -r '.Digest')
        new_image_digest=$(skopeo inspect docker://$NEW_IMAGE | jq -r '.Digest')

        if [[ "$old_image_digest" == "$new_image_digest" ]]; then
          echo "Image digest has not changed from currently deployed image. Skipping deployment."
          echo "Currently deployed image: $OLD_IMAGE"
          echo "Currently deployed digest: $old_image_digest"
          echo "skip-deployment=true" >> "$GITHUB_OUTPUT"
        else
          echo "Image digest has changed. Proceeding with deployment."
          echo "Currently deployed image: $OLD_IMAGE"
          echo "Currently deployed digest: $old_image_digest"
          echo "New image: $NEW_IMAGE"
          echo "New digest: $new_image_digest"
          echo "skip-deployment=false" >> "$GITHUB_OUTPUT"
        fi
      env:
        NEW_IMAGE: ${{ format('{0}/{1}/{2}:{3}-{4}', inputs.registry, inputs.system, inputs.name, github.sha, github.run_number) }}
        OLD_IMAGE: ${{ format('{0}/{1}/{2}:{3}', inputs.registry, inputs.system, inputs.name, inputs.environment) }}

    - name: Copy image to new tag and push
      if: ${{ steps.check-image-digest.outputs.skip-deployment != 'true' }}
      shell: bash
      run: skopeo copy "docker://$IMAGE_NAME:$IMAGE_TAG" "docker://$IMAGE_NAME:$ENVIRONMENT"
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        IMAGE_NAME: ${{ format('{0}/{1}/{2}', inputs.registry, inputs.system, inputs.name) }}
        IMAGE_TAG: ${{ format('{0}-{1}', github.sha, github.run_number) }}

    - name: Wait for Argo CD application to sync
      if: ${{ steps.check-image-digest.outputs.skip-deployment != 'true' }}
      shell: bash
      run: |
        curl -v \
          -H "X-GitHub-OIDC-Token: $GH_ID_TOKEN" \
          -H 'Content-Type: application/json' \
          -d "{\"image\":\"$IMAGE\",\"system\":\"$SYSTEM\",\"cluster_type\":\"$CLUSTER_TYPE\",\"environment\":\"$ENVIRONMENT\",\"application_name\":\"$NAME\"}" \
          --fail-with-body \
          "$DEPLOYVIA_URL"
      env:
        GH_ID_TOKEN: ${{ steps.get-token.outputs.token }}
        NAME: ${{ inputs.name }}
        SYSTEM: ${{ inputs.system }}
        CLUSTER_TYPE: ${{ inputs.cluster-type }}
        ENVIRONMENT: ${{ inputs.environment }}
        IMAGE: ${{ format('{0}/{1}/{2}:{3}', inputs.registry, inputs.system, inputs.name, inputs.environment) }}
        DEPLOYVIA_URL: ${{ format('https://deployvia.{0}/deployment', (inputs.environment == 'sandbox' && 'dev-elvia.io' || 'elvia.io')) }}
