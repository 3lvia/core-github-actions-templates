name: Verify action pinning policy

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - master
      - trunk

permissions:
  contents: read

jobs:
  verify:
    name: verify-action-pinning
    runs-on: ubuntu-latest

    steps:
      - name: Check out target repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check out policy scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          repository: '3lvia/core-github-actions-templates'
          path: '.policy-tools'

      - name: Validate workflows
        run: python3 .policy-tools/.github/scripts/verify_action_pinning.py
