name: Verify action pinning policy

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - master
      - trunk

permissions:
  contents: read

jobs:
  verify:
    name: verify-action-pinning
    runs-on: ubuntu-latest

    steps:
      - name: Check out target repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check out policy scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          repository: 3lvia/core-github-actions-templates
          path: .policy-tools

      - name: Validate workflows
        run: python3 .policy-tools/.github/scripts/verify_action_pinning.py
