name: Build ARC image

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  schedule:
    - cron: '3 4 * * *' # Daily at 04:03 UTC

concurrency:
  group: 'build-arc-image'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
      security-events: write
    env:
      IMAGE_NAME: 'ghcr.io/3lvia/actions-runner'
      TRIVY_SARIF: 'trivy-results.sarif'
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: 'ghcr.io'
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Get latest GitHub Actions Runner version
        id: get-runner-version
        run: echo "runner-version=$(curl -s https://api.github.com/repos/actions/runner/releases/latest | jq -r '.tag_name' | cut -c 2-)" >> "$GITHUB_OUTPUT"

      - name: Build image with cache and push to registry
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: 'arc'
          push: 'true'
          tags: "${{ env.IMAGE_NAME }}:${{ github.sha }}${{ ((github.event_name == 'push' && github.ref == 'refs/heads/trunk') || github.event_name == 'schedule') && format(',{0}:latest', env.IMAGE_NAME) || '' }}"
          cache-from: 'type=registry,ref=${{ env.IMAGE_NAME }}:latest'
          cache-to: 'type=inline'
          platforms: 'linux/amd64'
          build-args: |
            TARGETOS=linux
            TARGETARCH=amd64
            RUNNER_VERSION=${{ steps.get-runner-version.outputs.runner-version }}

      #     - name: Scan image with Trivy
      #       uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
      #       with:
      #         image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
      #         ignore-unfixed: 'true'
      #         format: 'sarif'
      #         exit-code: '0'
      #         output: ${{ env.TRIVY_SARIF }}
      #       env:
      #         TRIVY_DB_REPOSITORY: 'public.ecr.aws/aquasecurity/trivy-db:2'
      #         TRIVY_JAVA_DB_REPOSITORY: 'public.ecr.aws/aquasecurity/trivy-java-db:1'

      #     - name: Upload Trivy scan results
      #       uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc # v4
      #       with:
      #         sarif_file: ${{ env.TRIVY_SARIF }}
      #         category: 'Trivy'

      - name: Notify Slack on failure
        if: failure()
        uses: 3lvia/core-github-actions-templates/slack-message@trunk
        with:
          system: 'core'
          environment: 'prod'
          slack-channel: '#team-core-alerts'
          message: |
            :warning: ${{ github.workflow }} feilet. Se https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} for detaljer.
