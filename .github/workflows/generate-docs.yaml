name: Generate action documentation

on:
  push:
    branches: [trunk]
    paths:
      - '.github/workflows/generate-docs.yaml'
      - '**/action.yml'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.event_name }}'
  cancel-in-progress: true

jobs:
  generate-docs:
    name: Generate action documentation
    runs-on: elvia-runner
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Generate docs
        uses: 3lvia/gh-actions-docs@2db29362f0d6d92052f6fa49b71743af5f0c11f8 # v1
        with:
          ignore-files: 'my-new-action/action.yml'
          ignore-headers: '# core-github-actions-templates,## Table of Contents'
          run-prettier: 'true'

      - name: Commit changes
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo 'No changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add README.md
          git commit -m 'Update action documentation'
          git push
        env:
          GH_TOKEN: ${{ github.token }}

