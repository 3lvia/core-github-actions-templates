name: Check format of workflows

on:
  pull_request:
    branches: [trunk]
  push:
    branches: [trunk]

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prettier-check:
    name: 'Prettier check'
    runs-on: elvia-runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check format of workflows and markdown files
        run: |
          echo '.github/workflows/example-*.yml' > .prettierignore
          npx --yes prettier@3.9.9 -c --single-quote "**/*.yml" "**/*.md"
