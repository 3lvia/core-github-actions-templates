name: Check format of workflows

on:
  pull_request:
    branches: [trunk]
  push:
    branches: [trunk]

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  prettier-check:
    name: 'Prettier check'
    runs-on: elvia-runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn global add prettier

      - name: Check format of workflows and markdown files
        run: |
          echo '.github/workflows/example-*.yml' > .prettierignore
          prettier -c --single-quote "**/*.yml" "**/*.md"
