name: GitHub Actions Security Analysis with zizmor 🌈

on:
  push:
    branches:
      - main
      - master
      - trunk
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read # only needed for private repos
      actions: read # only needed for private repos
      security-events: write # for reporting to ghas
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Write zizmor config
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/zizmor.yml" <<'EOF'
          rules:
            unpinned-uses:
              config:
                policies:
                  3lvia/*: ref-pin
                  "*": hash-pin
          EOF

      - name: Verify zizmor config
        shell: bash
        run: |
          test -f "$GITHUB_WORKSPACE/zizmor.yml"
          ls -l "$GITHUB_WORKSPACE/zizmor.yml"
          echo "--- zizmor.yml ---"
          cat "$GITHUB_WORKSPACE/zizmor.yml"

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          advanced-security: true # write to ghas
