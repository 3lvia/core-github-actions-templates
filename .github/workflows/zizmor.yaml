name: GitHub Actions Security Analysis with zizmor 🌈

on:
  push:
    branches:
      - main
      - master
      - trunk
  pull_request:
    branches: ["**"]
  #Currently added daily schedule while rule is in eval mode to collect information from all repositories
  schedule:
    - cron: '0 21 * * *'

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    env:
      ZIZMOR_FAIL_ON_FINDINGS: "false"
    permissions:
      contents: read # only needed for private repos
      actions: read # only needed for private repos
      security-events: write # for reporting to ghas
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write zizmor config
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/zizmor.yml" <<'EOF'
          rules:
            unpinned-uses:
              config:
                policies:
                  3lvia/*: ref-pin
                  "*": hash-pin
          EOF

      - name: Verify zizmor config
        shell: bash
        run: |
          test -f "$GITHUB_WORKSPACE/zizmor.yml"
          ls -l "$GITHUB_WORKSPACE/zizmor.yml"
          echo "--- zizmor.yml ---"
          cat "$GITHUB_WORKSPACE/zizmor.yml"

      - name: Run zizmor 🌈
        id: zizmor_scan
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: true # write to ghas

      - name: Parse findings and diagnostics
        shell: bash
        run: |
          set -euo pipefail

          SARIF_FILE="${{ steps.zizmor_scan.outputs.output-file }}"
          echo "sarif_output_file=${SARIF_FILE}"

          if [[ -z "${SARIF_FILE}" || ! -f "${SARIF_FILE}" ]]; then
            echo "No SARIF file found from zizmor-action output"
            exit 1
          fi

          echo "sarif_file_exists=true"

          SARIF_RESULT_COUNT=$(jq -r '[.runs[]? | .results[]?] | length' "${SARIF_FILE}")
          SARIF_RULE_COUNT=$(jq -r '[.runs[]? | .tool.driver.rules[]?] | length' "${SARIF_FILE}")
          echo "sarif_result_count=${SARIF_RESULT_COUNT}"
          echo "sarif_rule_count=${SARIF_RULE_COUNT}"

          FAIL_KIND_COUNT=$(jq -r '
            [
              .runs[]?
              | .results[]?
              | (.kind // "")
              | tostring
              | ascii_downcase
              | select(. == "fail")
            ]
            | length
          ' "${SARIF_FILE}")

          FAILS_PER_FILE=$(jq -r '
            def fail_path($result):
              [
                $result.codeFlows[]?.threadFlows[]?.locations[]?.location.logicalLocations[]?.properties.symbolic.key.Local.given_path,
                $result.locations[]?.physicalLocation.artifactLocation.uri,
                "unknown"
              ]
              | map(select(. != null and . != ""))
              | .[0];

            [
              .runs[]?
              | .results[]? as $result
              | select((($result.kind // "") | tostring | ascii_downcase) == "fail")
              | {
                  path: fail_path($result),
                  rule_id: ($result.ruleId // "unknown"),
                  line: (
                    $result.locations[]?.physicalLocation.region.startLine
                    // $result.locations[]?.physicalLocation.region.endLine
                    // "unknown"
                  ),
                  message: (
                    $result.message.text
                    // $result.message.markdown
                    // $result.ruleId
                    // "unknown error"
                  )
                }
            ]
            | sort_by(.path, .message)
            | group_by(.path)
            | map(
                .[0].path + "\n" +
                (map("  - [" + .rule_id + ":" + (.line | tostring) + "] " + .message) | join("\n"))
              )
            | join("\n")
          ' "${SARIF_FILE}")

          echo "Fail kind findings: ${FAIL_KIND_COUNT}"

          if [[ -n "${FAILS_PER_FILE}" ]]; then
            echo "Fail findings by file:"
            echo "${FAILS_PER_FILE}"
          fi

          if [[ "${FAIL_KIND_COUNT}" -gt 0 ]]; then
            echo "Workflow: Zizmor findings detected"

            if [[ "${ZIZMOR_FAIL_ON_FINDINGS,,}" == "true" ]]; then
              echo "Failing workflow: blocking zizmor findings detected"
              exit 1
            fi

            echo "ZIZMOR_FAIL_ON_FINDINGS=${ZIZMOR_FAIL_ON_FINDINGS}; not failing workflow"
          fi

          echo "=== Diagnostics Complete ==="
