name: GitHub Actions Security Analysis with zizmor 🌈

on:
  push:
    branches:
      - main
      - master
      - trunk
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read # only needed for private repos
      actions: read # only needed for private repos
      security-events: write # for reporting to ghas
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Write zizmor config
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/zizmor.yml" <<'EOF'
          rules:
            unpinned-uses:
              config:
                policies:
                  3lvia/*: ref-pin
                  "*": hash-pin
          EOF

      - name: Verify zizmor config
        shell: bash
        run: |
          test -f "$GITHUB_WORKSPACE/zizmor.yml"
          ls -l "$GITHUB_WORKSPACE/zizmor.yml"
          echo "--- zizmor.yml ---"
          cat "$GITHUB_WORKSPACE/zizmor.yml"

      - name: Run zizmor 🌈
        id: zizmor_scan
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          advanced-security: true # write to ghas

      - name: Upload zizmor SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: zizmor-sarif
          path: ${{ steps.zizmor_scan.outputs.output-file }}
          if-no-files-found: error

      - name: Fail on high severity findings
        shell: bash
        run: |
          set -euo pipefail

          SARIF_FILE="${{ steps.zizmor_scan.outputs.output-file }}"
          echo "Using SARIF file: ${SARIF_FILE}"

          if [[ -z "${SARIF_FILE}" || ! -f "${SARIF_FILE}" ]]; then
            echo "No SARIF file found from zizmor-action output"
            exit 1
          fi

          HIGH_COUNT=$(jq -r '
            def result_severity($run; $result):
              (
                $result.properties.problem.severity
                // $result.properties.severity
                // (
                  if (($result.ruleId // "") != "") then
                    ($run.tool.driver.rules // [] | map(select(.id == $result.ruleId)) | .[0].properties.problem.severity)
                  elif ($result.ruleIndex != null) then
                    (($run.tool.driver.rules // [])[$result.ruleIndex].properties.problem.severity)
                  else
                    null
                  end
                )
                // (
                  if (($result.ruleId // "") != "") then
                    ($run.tool.driver.rules // [] | map(select(.id == $result.ruleId)) | .[0].properties.severity)
                  elif ($result.ruleIndex != null) then
                    (($run.tool.driver.rules // [])[$result.ruleIndex].properties.severity)
                  else
                    null
                  end
                )
                // ""
              )
              | tostring
              | ascii_downcase;

            [
              .runs[]? as $run
              | $run.results[]? as $result
              | result_severity($run; $result)
              | select(. == "high")
            ]
            | length
          ' "${SARIF_FILE}")

          FAIL_KIND_COUNT=$(jq -r '
            [
              .runs[]?
              | .results[]?
              | (.kind // "")
              | tostring
              | ascii_downcase
              | select(. == "fail")
            ]
            | length
          ' "${SARIF_FILE}")

          ERROR_LEVEL_COUNT=$(jq -r '
            [
              .runs[]?
              | .results[]?
              | (.level // "")
              | tostring
              | ascii_downcase
              | select(. == "error")
            ]
            | length
          ' "${SARIF_FILE}")

          echo "High severity findings: ${HIGH_COUNT}"
          echo "Fail kind findings: ${FAIL_KIND_COUNT}"
          echo "Error level findings: ${ERROR_LEVEL_COUNT}"

          if [[ "${HIGH_COUNT}" -gt 0 || "${FAIL_KIND_COUNT}" -gt 0 || "${ERROR_LEVEL_COUNT}" -gt 0 ]]; then
            echo "Failing workflow: blocking zizmor findings detected"
            exit 1
          fi
