name: GitHub Actions Security Analysis with zizmor 🌈

on:
  push:
    branches:
      - main
      - master
      - trunk
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read # only needed for private repos
      actions: read # only needed for private repos
      security-events: write # for reporting to ghas
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Write zizmor config
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/zizmor.yml" <<'EOF'
          rules:
            unpinned-uses:
              config:
                policies:
                  3lvia/*: ref-pin
                  "*": hash-pin
          EOF

      - name: Verify zizmor config
        shell: bash
        run: |
          test -f "$GITHUB_WORKSPACE/zizmor.yml"
          ls -l "$GITHUB_WORKSPACE/zizmor.yml"
          echo "--- zizmor.yml ---"
          cat "$GITHUB_WORKSPACE/zizmor.yml"

      - name: Run zizmor 🌈
        id: zizmor_scan
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          advanced-security: true # write to ghas

      - name: Fail on high severity findings
        shell: bash
        run: |
          set -euo pipefail

          SARIF_FILE="${{ steps.zizmor_scan.outputs.output-file }}"
          # echo "Using SARIF file: ${SARIF_FILE}"

          if [[ -z "${SARIF_FILE}" || ! -f "${SARIF_FILE}" ]]; then
            echo "No SARIF file found from zizmor-action output"
            exit 1
          fi

          FAIL_KIND_COUNT=$(jq -r '
            [
              .runs[]?
              | .results[]?
              | (.kind // "")
              | tostring
              | ascii_downcase
              | select(. == "fail")
            ]
            | length
          ' "${SARIF_FILE}")

          FAILS_PER_FILE=$(jq -r '
            def fail_path($result):
              [
                $result.codeFlows[]?.threadFlows[]?.locations[]?.location.logicalLocations[]?.properties.symbolic.key.Local.given_path,
                $result.locations[]?.physicalLocation.artifactLocation.uri,
                "unknown"
              ]
              | map(select(. != null and . != ""))
              | .[0];

            [
              .runs[]?
              | .results[]? as $result
              | select((($result.kind // "") | tostring | ascii_downcase) == "fail")
              | {
                  path: fail_path($result),
                  rule_id: ($result.ruleId // "unknown"),
                  line: (
                    $result.locations[]?.physicalLocation.region.startLine
                    // $result.locations[]?.physicalLocation.region.endLine
                    // "unknown"
                  ),
                  message: (
                    $result.message.text
                    // $result.message.markdown
                    // $result.ruleId
                    // "unknown error"
                  )
                }
            ]
            | sort_by(.path, .message)
            | group_by(.path)
            | map(
                .[0].path + "\n" +
                (map("  - [" + .rule_id + ":" + (.line | tostring) + "] " + .message) | join("\n"))
              )
            | join("\n")
          ' "${SARIF_FILE}")

          echo "Fail kind findings: ${FAIL_KIND_COUNT}"

          if [[ -n "${FAILS_PER_FILE}" ]]; then
            echo "Fail findings by file:"
            echo "${FAILS_PER_FILE}"
          fi

          if [[ "${FAIL_KIND_COUNT}" -gt 0 ]]; then
            # echo "Failing workflow: blocking zizmor findings detected"
            # exit 1

            echo "Workflow: Zizmor findings detected"
          fi
