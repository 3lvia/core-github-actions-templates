name: SonarCloud
description: 'Run SonarCloud scanning on .NET code.'
inputs:
  github-token:
    description: 'Should normally be `secrets.GITHUB_TOKEN`.'
    required: true
  sonarcloud-token:
    description: 'Should normally be `secrets.SONAR_TOKEN`.'
    required: true
  checkout:
    description: 'If `true`, the action will check out the repository. If `false`, the action will assume the repository has already been checked out.'
    required: false
    default: 'true'
  working-directory:
    description: 'Will run SonarCloud on projects under this working directory.'
    required: false
    default: './'
  sonarcloud-project-key:
    description: 'The SonarCloud project key or id. Normally on the form `3lvia_repo-name`. The project must be manually created on sonarcloud.io. '
    required: true
  test-projects:
    description: 'Pattern to use to find test projects.'
    required: false
    default: '*unit*test*csproj'
  dotnet-coverage-runsettings-file:
    description: |
      Path to a dotnet-coverage runsettings file, relative to the root of the repository.
      If not specified, no runsettings file will be used for dotnet-coverage.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      if: ${{ inputs.checkout == 'true' }}
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

    - name: Set up JDK 17
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install uuidgen
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y uuid-runtime

    - name: Cache SonarCloud packages
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: '~/.sonar/cache'
        key: '${{ runner.os }}-sonar'
        restore-keys: '${{ runner.os }}-sonar'

    - name: Cache SonarCloud scanner
      id: cache-sonar-scanner3
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: './sonar/scanner'
        key: '${{ runner.os }}-sonar-scanner3'
        restore-keys: '${{ runner.os }}-sonar-scanner3'

    - name: Install SonarCloud scanner
      shell: bash
      if: steps.cache-sonar-scanner3.outputs.cache-hit != 'true'
      run: |
        mkdir ./sonar ./sonar/scanner
        dotnet tool update dotnet-sonarscanner --tool-path ./sonar/scanner
        dotnet tool install dotnet-coverage --tool-path ./sonar/scanner

    - name: Build and analyze
      shell: bash
      run: |
        ./sonar/scanner/dotnet-sonarscanner begin /k:"$SONAR_CLOUD_PROJECT_KEY" /o:"elvia" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.vscoveragexml.reportsPaths=*_coverage.xml /d:sonar.scanner.scanAll=false

        testprojects=$(find . -iname "$TEST_PROJECTS")
        for testproject in $testprojects; do
          if [[ "$DOTNET_COVERAGE_RUNSETTINGS_FILE" != '' ]]; then
            ./sonar/scanner/dotnet-coverage collect "dotnet test -l:trx $testproject" -f xml -o "$(uuidgen)_coverage.xml" --settings "$DOTNET_COVERAGE_RUNSETTINGS_FILE"
          else
            ./sonar/scanner/dotnet-coverage collect "dotnet test -l:trx $testproject" -f xml -o "$(uuidgen)_coverage.xml"
          fi
        done

        ./sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
      env:
        DOTNET_COVERAGE_RUNSETTINGS_FILE: ${{ inputs.dotnet-coverage-runsettings-file }}
        GITHUB_TOKEN: ${{ inputs.github-token }} # Needed to get PR information, if any
        SONAR_TOKEN: ${{ inputs.sonarcloud-token }}
        SONAR_CLOUD_PROJECT_KEY: ${{ inputs.sonarcloud-project-key }}
        TEST_PROJECTS: ${{ inputs.test-projects }}
      working-directory: ${{ inputs.working-directory }}
