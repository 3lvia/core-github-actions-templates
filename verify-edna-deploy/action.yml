name: 'Verify Edna Deploy'
description: |
  Checking if a certain metric has been updated after the deployment happened
  Returns success (return code 0) if the query has a result.
  Returns failure if the result is empty (return code 1).
inputs:
  environment:
    description: 'Environment is used to find correct vault instance.'
    required: true
  system:
    description: 'System name is used in the derived PromQL query.'
    required: true
  application:
    description: 'Application name is used in the derived PromQL query.'
    required: true
  topic:
    description: 'Topic name is used in the derived PromQL query.'
    required: true
  type:
    description: 'publisher or consumer.'
    required: true
  checkout:
    description: 'If `true`, the action will check out the repository. If `false`, the action will assume the repository has already been checked out.'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Checkout repository
      if: ${{ inputs.checkout == 'true' }}
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Login Vault and export token
      uses: 3lvia/core-github-actions-templates/vault@trunk
      with:
        system: ${{ inputs.system }}
        environment: ${{ inputs.environment }}
        exportToken: 'true'

    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.14'

    - name: Run validation script
      shell: bash
      run: |
        pip install -r '${{ github.action_path }}/requirements.txt'
        python "$GITHUB_ACTION_PATH/validate_edna_deploy.py" \
          --topic "$TOPIC" \
          --system "$SYSTEM" \
          --application "$APPLICATION" \
          --env "$ENVIRONMENT" \
          --type "$TYPE"
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        TOPIC: ${{ inputs.topic }}
        SYSTEM: ${{ inputs.system }}
        APPLICATION: ${{ inputs.application }}
        ENVIRONMENT: ${{ inputs.environment }}
        TYPE: ${{ inputs.type }}
