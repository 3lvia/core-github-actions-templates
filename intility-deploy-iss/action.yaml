name: Intility Deploy ISS
description: |
  Deploy a prebuilt zip artifact to IIS with Azure DevOps parity.
  This action assumes a self-hosted Windows runner with network access to target hosts.
  If Vault is used, caller workflow must grant id-token: write permission.
  Implements IIS lifecycle management: stop site/pool → deploy → start site/pool.

inputs:
  system:
    description: System name used by the Vault action role mapping.
    required: true
  environment:
    description: Deployment environment.
    required: true
  target-host:
    description: Target host used for remote PowerShell operations.
    required: true
  target-dir:
    description: Temporary deployment path on target host.
    required: true
  site-dir:
    description: Final IIS site directory on target host.
    required: true
  site-name:
    description: IIS site name.
    required: true
  app-pool-name:
    description: IIS application pool name.
    required: true
  source-path:
    description: Local source path to deploy (relative to runner temp or absolute).
    required: true
  replace-target-files:
    description: ReplaceTokens sources pattern(s), relative to extracted folder.
    required: true
  replace-tokens:
    description: Inline token variables for replacement (YAML or JSON format).
    required: true
  variables:
    description: Vault secrets mapping (same syntax as vault action input secrets).
    required: false
    default: ''
  agent-user:
    description: Credential username used for PowerShell remoting.
    required: true
  agent-password:
    description: Credential password used for PowerShell remoting.
    required: true
  communication-protocol:
    description: Remote protocol for PowerShell remoting (http or https).
    required: false
    default: http
  token-pattern:
    description: Token pattern passed to qetza/replacetokens-action.
    required: false
    default: default

runs:
  using: composite
  steps:
    - name: Explicit check for required inputs
      shell: pwsh
      run: |
        if ([string]::IsNullOrWhiteSpace($env:SYSTEM)) { throw "Parameter 'system' is required, but is empty." }
        if ([string]::IsNullOrWhiteSpace($env:ENVIRONMENT)) { throw "Parameter 'environment' is required, but is empty." }
        if ([string]::IsNullOrWhiteSpace($env:TARGET_HOST)) { throw "Parameter 'target-host' is required, but is empty." }
        if ([string]::IsNullOrWhiteSpace($env:TARGET_DIR)) { throw "Parameter 'target-dir' is required, but is empty." }
        if ([string]::IsNullOrWhiteSpace($env:SITE_DIR)) { throw "Parameter 'site-dir' is required, but is empty." }
        if ([string]::IsNullOrWhiteSpace($env:SITE_NAME)) { throw "Parameter 'site-name' is required, but is empty." }
        if ([string]::IsNullOrWhiteSpace($env:APP_POOL_NAME)) { throw "Parameter 'app-pool-name' is required, but is empty." }
        if ([string]::IsNullOrWhiteSpace($env:SOURCE_PATH)) { throw "Parameter 'source-path' is required, but is empty." }
        if ([string]::IsNullOrWhiteSpace($env:REPLACE_TARGET_FILES)) { throw "Parameter 'replace-target-files' is required, but is empty." }
        if ([string]::IsNullOrWhiteSpace($env:REPLACE_TOKENS)) { throw "Parameter 'replace-tokens' is required, but is empty." }
        if ([string]::IsNullOrWhiteSpace($env:AGENT_USER)) { throw "Parameter 'agent-user' is required, but is empty." }
        if ([string]::IsNullOrWhiteSpace($env:AGENT_PASSWORD)) { throw "Parameter 'agent-password' is required, but is empty." }
        if ($env:COMMUNICATION_PROTOCOL -ne 'http' -and $env:COMMUNICATION_PROTOCOL -ne 'https') { throw "Parameter 'communication-protocol' must be 'http' or 'https'." }
      env:
        SYSTEM: ${{ inputs.system }}
        ENVIRONMENT: ${{ inputs.environment }}
        TARGET_HOST: ${{ inputs.target-host }}
        TARGET_DIR: ${{ inputs.target-dir }}
        SITE_DIR: ${{ inputs.site-dir }}
        SITE_NAME: ${{ inputs.site-name }}
        APP_POOL_NAME: ${{ inputs.app-pool-name }}
        SOURCE_PATH: ${{ inputs.source-path }}
        REPLACE_TARGET_FILES: ${{ inputs.replace-target-files }}
        REPLACE_TOKENS: ${{ inputs.replace-tokens }}
        AGENT_USER: ${{ inputs.agent-user }}
        AGENT_PASSWORD: ${{ inputs.agent-password }}
        COMMUNICATION_PROTOCOL: ${{ inputs.communication-protocol }}

    - name: Resolve deployment paths
      shell: pwsh
      run: |
        $dropPath = Join-Path "${{ runner.temp }}" "drop"
        $extractPath = Join-Path "${{ runner.temp }}" "iss-deployment"
        "DROP_PATH=$dropPath" | Out-File -FilePath $env:GITHUB_ENV -Append
        "EXTRACT_PATH=$extractPath" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Get secrets from Vault
      if: ${{ inputs.variables != '' }}
      uses: 3lvia/core-github-actions-templates/vault@trunk
      with:
        system: ${{ inputs.system }}
        environment: ${{ inputs.environment }}
        secrets: |
          ${{ inputs.variables }}

    - name: Test connection to server
      shell: pwsh
      run: |
        $securePassword = ConvertTo-SecureString "$env:AGENT_PASSWORD" -AsPlainText -Force
        $credential = New-Object System.Management.Automation.PSCredential ($env:AGENT_USER, $securePassword)
        $useSsl = $env:COMMUNICATION_PROTOCOL -eq 'https'
        $session = New-PSSession -ComputerName $env:TARGET_HOST -Credential $credential -UseSSL:$useSsl
        try {
          Invoke-Command -Session $session -ScriptBlock { Write-Output "Intility connection working" }
        }
        finally {
          Remove-PSSession -Session $session
        }
      env:
        TARGET_HOST: ${{ inputs.target-host }}
        AGENT_USER: ${{ inputs.agent-user }}
        AGENT_PASSWORD: ${{ inputs.agent-password }}
        COMMUNICATION_PROTOCOL: ${{ inputs.communication-protocol }}

    - name: Download application zipfile
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
      with:
        name: drop
        path: ${{ env.DROP_PATH }}

    - name: Extract application zipfile
      shell: pwsh
      run: |
        New-Item -Path "$env:EXTRACT_PATH" -ItemType Directory -Force | Out-Null
        Remove-Item -Path (Join-Path "$env:EXTRACT_PATH" '*') -Recurse -Force -ErrorAction SilentlyContinue
        $zip = Get-ChildItem -Path "$env:DROP_PATH" -Filter '*.zip' | Select-Object -First 1
        if (-not $zip) {
          throw "No .zip artifact found in $env:DROP_PATH"
        }
        Expand-Archive -Path $zip.FullName -DestinationPath "$env:EXTRACT_PATH" -Force

    - name: Prepare inline token variables for replacement
      shell: pwsh
      run: |
        # Parse inline variables and pass them to the action
        $vars = @{}
        Get-ChildItem Env: | ForEach-Object {
          $vars[$_.Name] = $_.Value
        }
        $json = $vars | ConvertTo-Json -Compress -Depth 5
        "REPLACE_TOKENS_ENV_VARS=$json" | Out-File -FilePath $env:GITHUB_ENV -Append
        "INLINE_TOKENS=$($env:REPLACE_TOKENS)" | Out-File -FilePath $env:GITHUB_ENV -Append
      env:
        REPLACE_TOKENS: ${{ inputs.replace-tokens }}

    - name: Replace tokens in config files
      uses: qetza/replacetokens-action@v1
      with:
        root: ${{ env.EXTRACT_PATH }}
        sources: ${{ inputs.replace-target-files }}
        token-pattern: ${{ inputs.token-pattern }}
        variables: |
          ["$REPLACE_TOKENS_ENV_VARS", "$INLINE_TOKENS"]

    - name: Copy files to remote server
      shell: pwsh
      run: |
        $securePassword = ConvertTo-SecureString "$env:AGENT_PASSWORD" -AsPlainText -Force
        $credential = New-Object System.Management.Automation.PSCredential ($env:AGENT_USER, $securePassword)
        $useSsl = $env:COMMUNICATION_PROTOCOL -eq 'https'

        $session = New-PSSession -ComputerName $env:TARGET_HOST -Credential $credential -UseSSL:$useSsl
        try {
          Invoke-Command -Session $session -ScriptBlock {
            param($targetDir)
            New-Item -Path $targetDir -ItemType Directory -Force | Out-Null
            Get-ChildItem -Path $targetDir -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          } -ArgumentList $env:TARGET_DIR

          Copy-Item -Path (Join-Path "$env:EXTRACT_PATH" '*') -Destination $env:TARGET_DIR -ToSession $session -Recurse -Force
        }
        finally {
          Remove-PSSession -Session $session
        }
      env:
        TARGET_HOST: ${{ inputs.target-host }}
        TARGET_DIR: ${{ inputs.target-dir }}
        AGENT_USER: ${{ inputs.agent-user }}
        AGENT_PASSWORD: ${{ inputs.agent-password }}
        COMMUNICATION_PROTOCOL: ${{ inputs.communication-protocol }}

    - name: Stop IIS Site
      shell: pwsh
      run: |
        $securePassword = ConvertTo-SecureString "$env:AGENT_PASSWORD" -AsPlainText -Force
        $credential = New-Object System.Management.Automation.PSCredential ($env:AGENT_USER, $securePassword)
        $useSsl = $env:COMMUNICATION_PROTOCOL -eq 'https'

        $session = New-PSSession -ComputerName $env:TARGET_HOST -Credential $credential -UseSSL:$useSsl
        try {
          Invoke-Command -Session $session -ScriptBlock {
            param($siteName)
            & $env:windir\System32\inetsrv\appcmd stop site /site.name:$siteName
          } -ArgumentList $env:SITE_NAME
        }
        finally {
          Remove-PSSession -Session $session
        }
      env:
        TARGET_HOST: ${{ inputs.target-host }}
        SITE_NAME: ${{ inputs.site-name }}
        AGENT_USER: ${{ inputs.agent-user }}
        AGENT_PASSWORD: ${{ inputs.agent-password }}
        COMMUNICATION_PROTOCOL: ${{ inputs.communication-protocol }}

    - name: Stop IIS App pool
      shell: pwsh
      run: |
        $securePassword = ConvertTo-SecureString "$env:AGENT_PASSWORD" -AsPlainText -Force
        $credential = New-Object System.Management.Automation.PSCredential ($env:AGENT_USER, $securePassword)
        $useSsl = $env:COMMUNICATION_PROTOCOL -eq 'https'

        $session = New-PSSession -ComputerName $env:TARGET_HOST -Credential $credential -UseSSL:$useSsl
        try {
          Invoke-Command -Session $session -ScriptBlock {
            param($appPoolName)
            & $env:windir\System32\inetsrv\appcmd stop apppool /apppool.name:$appPoolName
          } -ArgumentList $env:APP_POOL_NAME
        }
        finally {
          Remove-PSSession -Session $session
        }
      env:
        TARGET_HOST: ${{ inputs.target-host }}
        APP_POOL_NAME: ${{ inputs.app-pool-name }}
        AGENT_USER: ${{ inputs.agent-user }}
        AGENT_PASSWORD: ${{ inputs.agent-password }}
        COMMUNICATION_PROTOCOL: ${{ inputs.communication-protocol }}

    - name: Copy files from temp to site directory
      shell: pwsh
      run: |
        $securePassword = ConvertTo-SecureString "$env:AGENT_PASSWORD" -AsPlainText -Force
        $credential = New-Object System.Management.Automation.PSCredential ($env:AGENT_USER, $securePassword)
        $useSsl = $env:COMMUNICATION_PROTOCOL -eq 'https'

        $session = New-PSSession -ComputerName $env:TARGET_HOST -Credential $credential -UseSSL:$useSsl
        try {
          Invoke-Command -Session $session -ScriptBlock {
            param($targetDir, $siteDir)
            # Use cp -Force -Recurse pattern from Azure template for parity
            cp -Force -Recurse "$targetDir*" $siteDir
          } -ArgumentList $env:TARGET_DIR, $env:SITE_DIR
        }
        finally {
          Remove-PSSession -Session $session
        }
      env:
        TARGET_HOST: ${{ inputs.target-host }}
        TARGET_DIR: ${{ inputs.target-dir }}
        SITE_DIR: ${{ inputs.site-dir }}
        AGENT_USER: ${{ inputs.agent-user }}
        AGENT_PASSWORD: ${{ inputs.agent-password }}
        COMMUNICATION_PROTOCOL: ${{ inputs.communication-protocol }}

    - name: Start IIS Site
      shell: pwsh
      run: |
        $securePassword = ConvertTo-SecureString "$env:AGENT_PASSWORD" -AsPlainText -Force
        $credential = New-Object System.Management.Automation.PSCredential ($env:AGENT_USER, $securePassword)
        $useSsl = $env:COMMUNICATION_PROTOCOL -eq 'https'

        $session = New-PSSession -ComputerName $env:TARGET_HOST -Credential $credential -UseSSL:$useSsl
        try {
          Invoke-Command -Session $session -ScriptBlock {
            param($siteName)
            & $env:windir\System32\inetsrv\appcmd start site /site.name:$siteName
          } -ArgumentList $env:SITE_NAME
        }
        finally {
          Remove-PSSession -Session $session
        }
      env:
        TARGET_HOST: ${{ inputs.target-host }}
        SITE_NAME: ${{ inputs.site-name }}
        AGENT_USER: ${{ inputs.agent-user }}
        AGENT_PASSWORD: ${{ inputs.agent-password }}
        COMMUNICATION_PROTOCOL: ${{ inputs.communication-protocol }}

    - name: Start IIS App pool
      shell: pwsh
      run: |
        $securePassword = ConvertTo-SecureString "$env:AGENT_PASSWORD" -AsPlainText -Force
        $credential = New-Object System.Management.Automation.PSCredential ($env:AGENT_USER, $securePassword)
        $useSsl = $env:COMMUNICATION_PROTOCOL -eq 'https'

        $session = New-PSSession -ComputerName $env:TARGET_HOST -Credential $credential -UseSSL:$useSsl
        try {
          Invoke-Command -Session $session -ScriptBlock {
            param($appPoolName)
            & $env:windir\System32\inetsrv\appcmd start apppool /apppool.name:$appPoolName
          } -ArgumentList $env:APP_POOL_NAME
        }
        finally {
          Remove-PSSession -Session $session
        }
      env:
        TARGET_HOST: ${{ inputs.target-host }}
        APP_POOL_NAME: ${{ inputs.app-pool-name }}
        AGENT_USER: ${{ inputs.agent-user }}
        AGENT_PASSWORD: ${{ inputs.agent-password }}
        COMMUNICATION_PROTOCOL: ${{ inputs.communication-protocol }}
